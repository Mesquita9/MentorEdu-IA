<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />

    <!-- Faz a página se adaptar ao celular, notebook e desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thux</title>

    <!-- Arquivo de estilos da interface -->
    <link rel="stylesheet" href="/frontend/style.css" />

    <!-- KaTeX: biblioteca para renderizar fórmulas em LaTeX futuramente -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
</head>

<body>
    <main class="app-container">

        <!-- Cabeçalho principal do Thux -->
        <header class="thux-header">
            <div class="thux-logo-area">
                <div class="thux-logo">
                    🐧
                </div>

                <div>
                    <h1>Thux</h1>
                    <p>Ferramenta digital inteligente para estudo e ensino.</p>
                </div>
            </div>

            <div class="status-pill">
                online
            </div>
        </header>

        <!-- Área onde as mensagens aparecem -->
        <section class="chat-panel" id="chatPanel">
            <div class="message thux-message">
                <div class="message-author">Thux</div>
                <div class="message-content">
                    Fala. Estou online. Manda o conteúdo que a gente destrincha sem frescura.
                </div>
            </div>
        </section>

        <!-- Área inferior do chat -->
        <footer class="chat-input-area">

            <!-- Menu flutuante do botão + -->
            <div class="plus-menu" id="plusMenu">
                <button type="button" class="plus-menu-item">
                    Enviar PDF
                    <span>base de conhecimento</span>
                </button>

                <button type="button" class="plus-menu-item">
                    Enviar imagem
                    <span>apoio visual</span>
                </button>

                <button type="button" class="plus-menu-item">
                    Enviar anotação
                    <span>contexto rápido</span>
                </button>
            </div>

            <div class="input-wrapper">
                <!-- Botão para abrir opções futuras -->
                <button type="button" class="icon-button" id="plusButton">
                    +
                </button>

                <!-- Campo de texto do usuário -->
                <textarea
                    id="messageInput"
                    placeholder="Pergunte algo ao Thux..."
                    rows="1"
                ></textarea>

                <!-- Botão de envio -->
                <button type="button" class="send-button" id="sendButton">
                    Enviar
                </button>
            </div>
        </footer>
    </main>

    <!-- Script da interface -->
    <script src="/frontend/script.js"></script>
</body>
</html>
