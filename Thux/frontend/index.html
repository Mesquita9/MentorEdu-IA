<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thux-AI</title>

    <link rel="stylesheet" href="/frontend/style.css" />
</head>

<body>
    <main class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo-area">
                <img
                    src="/frontend/assets/thux-logo.png"
                    alt="Thux-AI"
                    class="sidebar-logo"
                />
            </div>

            <nav class="teacher-tools hidden" id="teacherTools">
                <div class="active-mode-box">
                    <span>Modo de aula</span>
                    <strong id="sidebarModeLabel">Física</strong>
                </div>

                <div class="tool-group">
                    <button type="button" class="tool-button" id="newChatButton">
                        Nova conversa
                    </button>

                    <button type="button" class="tool-button soon-button">
                        Salvar conversa
                    </button>

                    <button type="button" class="tool-button soon-button">
                        Exportar PDF
                    </button>

                    <button type="button" class="tool-button danger soon-button">
                        Excluir conversa
                    </button>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-line"></div>

                <div class="dev-credit">
                    <span>Desenvolvido por</span>
                    <strong>Iago Mesquita</strong>
                </div>
            </div>
        </aside>

        <section class="main-area">
            <div class="main-shell">
                <section class="start-screen" id="startScreen">
                    <div class="start-left">
                        <div class="start-badge">Painel de aula</div>

                        <h1>O que vamos conduzir hoje?</h1>

                        <p>
                            Escolha a frente da aula para o Thux entrar no contexto certo.
                        </p>

                        <div class="choice-stack">
                            <button class="choice-button" data-mode="Física">
                                <span>Física</span>
                            </button>

                            <button class="choice-button" data-mode="Matemática">
                                <span>Matemática</span>
                            </button>
                        </div>
                    </div>

                    <div class="start-right">
                        <img
                            src="/frontend/assets/thux-logo.png"
                            alt="Thux-AI"
                            class="hero-logo"
                        />
                    </div>
                </section>

                <section class="chat-screen hidden" id="chatScreen">
                    <header class="chat-header">
                        <button type="button" class="back-button" id="backButton">
                            ← trocar modo
                        </button>

                        <div class="chat-title-area">
                            <h1>Thux-AI</h1>
                            <p id="modeSubtitle">modo Física</p>
                        </div>

                        <div></div>
                    </header>

                    <section class="chat-panel" id="chatPanel"></section>

                    <footer class="chat-input-area">
                        <button type="button" class="plus-button" id="plusButton">
                            +
                        </button>

                        <textarea
                            id="messageInput"
                            placeholder="Digite sua mensagem..."
                            rows="1"
                        ></textarea>

                        <button type="button" class="send-button" id="sendButton">
                            ➤
                        </button>

                        <div class="plus-menu" id="plusMenu">
                            <button type="button" class="soon-button">Salvar conversa</button>
                            <button type="button" class="soon-button">Exportar PDF</button>
                            <button type="button" class="soon-button">Excluir conversa</button>
                        </div>
                    </footer>
                </section>

                <div class="toast" id="toast"></div>
            </div>
        </section>
    </main>

    <script src="/frontend/script.js"></script>
</body>
</html>
