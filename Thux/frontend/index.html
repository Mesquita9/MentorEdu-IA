<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thux-AI</title>

    <link rel="stylesheet" href="/frontend/style.css" />

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
</head>

<body>
    <div class="background-grid"></div>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="app-shell">
        <section class="hero-card">
            <div class="brand-area">
                <div class="logo-frame">
                    <img
                        src="/frontend/assets/thux-logo.png"
                        alt="Logo do Thux-AI"
                        class="thux-logo-img"
                    />
                </div>

                <div class="brand-text">
                    <div class="eyebrow">Thux-AI</div>
                    <h1>Estudo com fonte, contexto e sem enrolação.</h1>
                    <p>
                        Um assistente educacional em modo grafite: consulta biblioteca,
                        explica com didática e mantém o pé no chão.
                    </p>
                </div>
            </div>

            <div class="system-status">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </section>

        <section class="chat-card">
            <header class="chat-topbar">
                <div class="terminal-controls">
                    <span class="terminal-dot dot-red"></span>
                    <span class="terminal-dot dot-yellow"></span>
                    <span class="terminal-dot dot-green"></span>
                </div>

                <div class="chat-title">
                    <span>~/thux-ai/chat</span>
                </div>

                <div class="chat-mode">
                    Biblioteca ativa
                </div>
            </header>

            <section class="chat-panel" id="chatPanel">
                <div class="message thux-message">
                    <div class="message-meta">
                        <span class="message-author">Thux</span>
                        <span class="message-tag">sistema</span>
                    </div>

                    <div class="message-content">
                        Fala. Estou online. Manda o conteúdo que a gente destrincha sem frescura.
                    </div>
                </div>
            </section>

            <footer class="chat-input-area">
                <div class="plus-menu" id="plusMenu">
                    <button type="button" class="plus-menu-item">
                        <strong>Enviar PDF</strong>
                        <span>em breve: base de conhecimento local</span>
                    </button>

                    <button type="button" class="plus-menu-item">
                        <strong>Enviar imagem</strong>
                        <span>em breve: apoio visual</span>
                    </button>

                    <button type="button" class="plus-menu-item">
                        <strong>Enviar anotação</strong>
                        <span>em breve: contexto rápido</span>
                    </button>
                </div>

                <div class="input-wrapper">
                    <button
                        type="button"
                        class="icon-button"
                        id="plusButton"
                        aria-label="Abrir opções"
                    >
                        +
                    </button>

                    <textarea
                        id="messageInput"
                        placeholder="Pergunte algo ao Thux..."
                        rows="1"
                    ></textarea>

                    <button type="button" class="send-button" id="sendButton">
                        <span>Enviar</span>
                    </button>
                </div>
            </footer>
        </section>
    </main>

    <script src="/frontend/script.js"></script>
</body>
</html>
