<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thux-AI</title>

    <link rel="stylesheet" href="/frontend/style.css" />
</head>

<body>
    <main class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo-area">
                <img
                    src="/frontend/assets/thux-logo.png"
                    alt="Thux-AI"
                    class="sidebar-logo"
                />
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-line"></div>

                <div class="profile-area">
                    <div class="profile-icon">
                        <span></span>
                    </div>

                    <strong>Mesquita</strong>
                </div>
            </div>
        </aside>

        <section class="chat-area">
            <div class="chat-shell">
                <header class="chat-header">
                    <h1>Thux-AI</h1>
                    <div class="header-glow"></div>
                    <p>reprogramando o ensino da física</p>
                </header>

                <section class="chat-panel" id="chatPanel">
                    <div class="message-row thux-row welcome-row">
                        <div class="avatar">
                            <img src="/frontend/assets/thux-avatar.png" alt="Thux" />
                        </div>

                        <div class="message-bubble thux-bubble welcome-bubble">
                            <div class="message-content">
                                Fala, Mestre!<br />
                                Manda o B.O. de hoje.
                            </div>
                        </div>
                    </div>
                </section>

                <footer class="chat-input-area">
                    <button type="button" class="plus-button" id="plusButton">
                        +
                    </button>

                    <textarea
                        id="messageInput"
                        placeholder="Digite sua mensagem..."
                        rows="1"
                    ></textarea>

                    <button type="button" class="send-button" id="sendButton">
                        ➤
                    </button>

                    <div class="plus-menu" id="plusMenu">
                        <button type="button">Enviar PDF</button>
                        <button type="button">Enviar imagem</button>
                        <button type="button">Enviar anotação</button>
                    </div>
                </footer>
            </div>
        </section>
    </main>

    <script src="/frontend/script.js"></script>
</body>
</html>
