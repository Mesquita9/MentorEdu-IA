<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thux-AI</title>

    <link rel="stylesheet" href="/frontend/style.css" />
</head>

<body>
    <main class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo-area">
                <img
                    src="/frontend/assets/thux-logo.png"
                    alt="Thux-AI"
                    class="sidebar-logo"
                />
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-line"></div>

                <div class="dev-credit">
                    <span>Desenvolvido por</span>
                    <strong>Iago Mesquita</strong>
                </div>
            </div>
        </aside>

        <section class="chat-area">
            <div class="chat-shell">
                <header class="chat-header">
                    <h1>Thux-AI</h1>
                    <div class="header-glow"></div>
                    <p id="modeSubtitle">reprogramando o ensino da física</p>
                </header>

                <section class="start-screen" id="startScreen">
                    <div class="start-card">
                        <span class="start-kicker">Modo de aula</span>

                        <h2>O que vamos conduzir hoje?</h2>

                        <p>
                            Escolha a frente da aula para o Thux entrar no contexto certo.
                        </p>

                        <div class="discipline-grid">
                            <button class="discipline-card" data-mode="Física">
                                <strong>Física</strong>
                                <span>Demonstrações, problemas e dúvidas ao vivo.</span>
                            </button>

                            <button class="discipline-card" data-mode="Matemática">
                                <strong>Matemática</strong>
                                <span>Funções, gráficos, conjuntos e exercícios.</span>
                            </button>
                        </div>
                    </div>
                </section>

                <section class="chat-panel hidden" id="chatPanel"></section>

                <footer class="chat-input-area hidden" id="chatInputArea">
                    <button type="button" class="plus-button" id="plusButton">
                        +
                    </button>

                    <textarea
                        id="messageInput"
                        placeholder="Digite sua mensagem..."
                        rows="1"
                    ></textarea>

                    <button type="button" class="send-button" id="sendButton">
                        ➤
                    </button>

                    <div class="plus-menu" id="plusMenu">
                        <button type="button">Salvar conversa</button>
                        <button type="button">Exportar PDF</button>
                        <button type="button">Nova conversa</button>
                    </div>
                </footer>
            </div>
        </section>
    </main>

    <script src="/frontend/script.js"></script>
</body>
</html>
